function recordLog(module,action,objectId,details,before='',after='',actorOverride=null){let actor=actorOverride||admin();db.logs.unshift({id:'LOG-'+String(Date.now()).slice(-8)+String(Math.floor(Math.random()*10)),actorId:actor.id,actorAccount:actor.account,at:timestamp(),module,action,objectId,result:'成功',details,before,after});save()}
const toast=(text,type='success')=>{let root=document.getElementById('toastHolder');let node=document.createElement('div');node.className='toast '+type;node.innerHTML=I(type==='success'?'check-circle':'alert-circle',16)+'<div>'+h(text)+'</div>';root.appendChild(node);setTimeout(()=>node.remove(),3500)};
async function pwdDigest(pass,salt){const s=salt+':'+pass;if(globalThis.crypto?.subtle){const result=await globalThis.crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(result)].map(v=>v.toString(16).padStart(2,'0')).join('')}let x=2166136261;for(let k=0;k<s.length;k++){x^=s.charCodeAt(k);x=Math.imul(x,16777619)}return 'fallback-'+(x>>>0).toString(16)}
async function ensureSeedHashes(){let changed=false;for(let i=0;i<db.admins.length;i++){let a=db.admins[i];if(!a.passwordHash&&DEMO_LOGINS[i]?.[0]===a.account){a.passwordHash=await pwdDigest(DEMO_LOGINS[i][1],a.salt);changed=true}}if(changed)save()}
function render(){let a=admin();if(!a){sessionAdminId='';demoSessionStorage.removeItem(SESSION);renderLogin();return}document.getElementById('app').innerHTML=`<div class="layout"><aside class="sidebar"><div class="brand"><div class="brand-mark">G</div><div class="brand-name">GDUTmate<small>ADMIN CONSOLE</small></div></div><div class="nav-label">工作台 / WORKSPACE</div><nav class="nav">${MODS.map(([key,label,ic])=>`<button type="button" class="nav-btn ${currentPage===key?'active':''} ${!can(key,'view')?'locked':''}" onclick="routeTo('${key}')" title="${label}">${I(ic,18)}<span>${label}</span>${!can(key,'view')?'<span class="lock">'+I('lock',12)+'</span>':''}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="side-user"><div class="side-avatar">${h(a.displayName[0])}</div><div><strong>${h(a.displayName)}</strong><span>${h(a.role)} · ${h(a.account)}</span></div></div><button class="side-logout" onclick="logout()">${I('log-out',15)}<span>退出管理端</span></button>${isSuper()?'<div class="side-reset" onclick="resetDemo()">重置演示数据</div>':''}</div></aside><div class="main"><header class="topbar"><div class="breadcrumbs">GDUTmate 管理后台 ${I('chevron-right',13)} <strong>${MOD_NAME[currentPage]}</strong></div><div class="top-actions"><span class="demo-label">DEMO · 本地模拟数据</span><span class="clock">${h(new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric'}).format(new Date()))}</span><div class="top-avatar">${h(a.displayName[0])}</div></div></header><main class="content" id="content">${can(currentPage,'view')?renderContent():noPermission()}</main></div></div>`;
 if(can(currentPage,'view'))renderTable(currentPage);
}
function pageHead(eyebrow,title,desc,actions=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><div class="subtitle">${desc}</div></div><div class="filter-row">${actions}</div></div>`}
function noPermission(){return pageHead('ACCESS CONTROL',MOD_NAME[currentPage],'此模块由管理员权限控制')+`<div class="permission-lock">${I('lock',34)}<h3>当前账号无访问权限</h3><p>如需操作，请联系有权限的超级管理员调整模块访问权限。</p></div>`}
function renderContent(){switch(currentPage){case'overview':return overviewHTML();case'users':return usersHTML();case'competitions':return competitionsHTML();case'recruitments':return recHTML();case'feedback':return feedbackHTML();case'settings':return settingsHTML()}}
function routeTo(page,params={}){if(!MOD_NAME[page])return;if(params.reset){if(page==='recruitments')filters.recruitments={q:'',comp:'all',business:'all',listed:'all'};if(page==='users')filters.users={q:'',status:'all'};if(page==='feedback')filters.feedback={q:''};pageNos[page]=1}if(page==='recruitments'){if(params.business)filters.recruitments.business=params.business;if(params.listed)filters.recruitments.listed=params.listed}currentPage=page;closeOverlay();render();window.scrollTo({top:0,behavior:'instant'})}
function countStats(){const listed=db.recruitments.filter(areListed);return {users:db.users.filter(x=>!x.deleted).length,posts:listed.length,teams:new Set(listed.filter(r=>bizStatus(r)==='招募中').map(x=>x.teamId)).size,feedback:db.feedback.length}}
function overviewHTML(){let s=countStats();const metrics=[['有效用户总数',s.users,'users','users','未删除的用户账号','blue',{reset:true}],['当前已上架招募帖',s.posts,'clipboard-list','recruitments','当前上架的招募帖','green',{reset:true,listed:'listed'}],['正在招募的队伍数',s.teams,'trophy','recruitments','按队伍 ID 去重','purple',{reset:true,business:'招募中',listed:'listed'}],['反馈总数',s.feedback,'message-square','feedback','收到的有效反馈','amber',{reset:true}]];return pageHead('DASHBOARD / 数据总览','平台运营概况','查看平台核心运营数据，点击统计卡片可进入对应管理列表。')+`<div class="notice">${I('info',14)}<span>当前为<strong>本地模拟数据</strong>，示例竞赛、日期及账号并非真实信息；管理端尚未连接客户端或服务器。</span></div><div class="kpi-grid">${metrics.map(m=>`<button class="kpi" onclick='routeTo(${JSON.stringify(m[3])},${JSON.stringify(m[6])})'><div class="kpi-top"><span class="kpi-label">${h(m[0])}</span><span class="kpi-icon ${m[5]==='blue'?'':m[5]}">${I(m[2],20)}</span></div><div class="kpi-value">${m[1]}</div><div class="kpi-bottom"><span>${h(m[4])}</span><span>查看详情 ${I('arrow-right',12)}</span></div></button>`).join('')}</div><div class="overview-lower"><section class="panel panel-pad recent-ops-panel"><div class="panel-title"><h3>最近管理操作</h3>${can('settings','view')?`<button class="text-btn" type="button" onclick="openLogs()">查看全部日志 ${I('arrow-right',12)}</button>`:''}</div>${can('settings','view')?recentOperationsHTML():`<p class="recent-ops-empty">当前账号无操作日志查看权限。</p>`}</section></div>`}
function recentOperationsHTML(){
 const latest=[...(db.logs||[])].sort((a,b)=>b.at.localeCompare(a.at)).slice(0,5);
 if(!latest.length)return `<p class="recent-ops-empty">暂无管理操作记录。</p>`;
 return `<div class="recent-ops-list">${latest.map(x=>{
  const actor=db.admins.find(a=>a.id===x.actorId);
  return `<button type="button" class="recent-ops-item" onclick="openRecentLog('${attr(x.id)}')" title="查看此操作日志详情"><span class="activity-dot" aria-hidden="true"></span><span><span class="recent-ops-title">${h(x.action)} <span class="mono">${h(x.objectId)}</span></span><span class="recent-ops-sub">${h(actor?.displayName||x.actorAccount)} · ${h(MOD_NAME[x.module]||x.module)}</span></span><span class="recent-ops-detail" title="${attr(x.details||'')}">${h(x.details||'—')}</span><time class="recent-ops-time">${h(x.at)}</time>${I('chevron-right',14)}</button>`;
 }).join('')}</div>`;
}
function openRecentLog(id){if(!can('settings','view')){toast('当前账号无操作日志查看权限','error');return}openLog(id)}
function usersHTML(){return pageHead('USER MANAGEMENT','用户管理','查看、维护学生账号资料，支持单条录入与批量导入。',`${can('users','create')?`<button class="btn" onclick="openBatchImport()">${I('upload',14)}批量导入</button><button class="btn primary" onclick="openUserForm()">${I('plus',15)}单个录入</button>`:''}`)+`<section class="panel"><div class="toolbar"><div class="filter-row"><div class="search-wrap">${I('search',15)}<input class="control search-input" value="${attr(filters.users.q)}" placeholder="搜索学号或昵称" oninput="setFilter('users','q',this.value)" /></div><select class="control" onchange="setFilter('users','status',this.value)"><option value="all">全部账号状态</option><option value="active" ${filters.users.status==='active'?'selected':''}>正常</option><option value="disabled" ${filters.users.status==='disabled'?'selected':''}>已停用</option></select></div><span class="muted" style="font-size:11px">支持账号详情、编辑、停用、重置密码与删除</span></div><div id="table-results"></div></section>`}
function competitionsHTML(){return pageHead('COMPETITION MANAGEMENT','竞赛管理','正式系统使用统一竞赛 ID，供客户端筛选、发布招募和比赛日历共用。',`${can('competitions','edit')?`<button class="btn" onclick="openCategories()">${I('filter',14)}类别管理</button>`:''}${can('competitions','create')?`<button class="btn primary" onclick="openCompetitionForm()">${I('plus',15)}新增竞赛</button>`:''}`)+`<div class="notice">${I('info',14)}<span>竞赛下架或删除后，关联招募帖同步下架；重新上架竞赛不会自动恢复招募帖。比赛日期未公布时可保持空白。</span></div><section class="panel"><div class="toolbar"><div class="filter-row"><div class="search-wrap">${I('search',15)}<input class="control search-input" value="${attr(filters.competitions.q)}" placeholder="搜索竞赛名称或 ID" oninput="setFilter('competitions','q',this.value)" /></div><select class="control" onchange="setFilter('competitions','category',this.value)"><option value="all">全部竞赛类别</option>${db.categories.map(c=>`<option value="${attr(c)}" ${filters.competitions.category===c?'selected':''}>${h(c)}</option>`).join('')}</select><select class="control" onchange="setFilter('competitions','listed',this.value)"><option value="all">全部上架状态</option><option value="listed" ${filters.competitions.listed==='listed'?'selected':''}>上架</option><option value="unlisted" ${filters.competitions.listed==='unlisted'?'selected':''}>下架</option></select></div></div><div id="table-results"></div></section>`}
function recHTML(){return pageHead('RECRUITMENT MANAGEMENT','招募管理','只做招募内容管理，不代替队长审批入队和维护组队关系。')+`<div class="notice">${I('info',14)}<span>“招募中、未开始、已截止、已关闭、名额已满”根据业务字段推导。管理员只可下架、删除或在条件满足时恢复展示，不可强制修改业务状态。</span></div><section class="panel"><div class="toolbar"><div class="filter-row"><div class="search-wrap">${I('search',15)}<input class="control search-input" value="${attr(filters.recruitments.q)}" placeholder="搜索队伍、岗位或帖子 ID" oninput="setFilter('recruitments','q',this.value)" /></div><select class="control" onchange="setFilter('recruitments','comp',this.value)"><option value="all">全部竞赛</option>${db.competitions.filter(c=>!c.deleted).map(c=>`<option value="${c.id}" ${filters.recruitments.comp===c.id?'selected':''}>${h(c.name)}</option>`).join('')}</select><select class="control" onchange="setFilter('recruitments','business',this.value)"><option value="all">全部业务状态</option>${['招募中','未开始','已截止','已关闭','名额已满'].map(x=>`<option ${filters.recruitments.business===x?'selected':''}>${x}</option>`).join('')}</select><select class="control" onchange="setFilter('recruitments','listed',this.value)"><option value="all">全部展示状态</option><option value="listed" ${filters.recruitments.listed==='listed'?'selected':''}>上架</option><option value="unlisted" ${filters.recruitments.listed==='unlisted'?'selected':''}>已下架</option></select></div></div><div id="table-results"></div></section>`}
function feedbackHTML(){return pageHead('FEEDBACK MANAGEMENT','反馈管理','保留客户端提交的原始反馈；仅查看，不设置处理状态与强制回复。')+`<section class="panel"><div class="toolbar"><div class="filter-row"><div class="search-wrap">${I('search',15)}<input class="control search-input" value="${attr(filters.feedback.q)}" placeholder="搜索反馈内容或提交人" oninput="setFilter('feedback','q',this.value)" /></div></div><span class="muted" style="font-size:11px">按提交时间倒序</span></div><div id="table-results"></div></section>`}
function settingsHTML(){return pageHead('SYSTEM SETTINGS','系统设置','仅包含管理员账号与操作日志；权限与日志接口在正式开发时需服务端校验。')+`<section class="panel"><div class="section-tabs"><button class="tab ${settingsTab==='admins'?'active':''}" onclick="settingsTab='admins';render()">管理员账号</button><button class="tab ${settingsTab==='logs'?'active':''}" onclick="settingsTab='logs';render()">操作日志</button></div>${settingsTab==='admins'?`<div class="toolbar"><div class="filter-row"><div class="search-wrap">${I('search',15)}<input class="control search-input" value="${attr(filters.admins.q)}" placeholder="搜索管理员账号或姓名" oninput="setFilter('admins','q',this.value)" /></div></div>${can('settings','create')?`<button class="btn primary" onclick="openAdminForm()">${I('plus',15)}新增管理员</button>`:''}</div>`:`<div class="toolbar"><div class="filter-row"><div class="search-wrap">${I('search',15)}<input class="control search-input" value="${attr(filters.logs.q)}" placeholder="搜索操作者、对象 ID" oninput="setFilter('logs','q',this.value)" /></div><select class="control" onchange="setFilter('logs','module',this.value)"><option value="all">全部模块</option>${MODS.map(([k,v])=>`<option value="${k}" ${filters.logs.module===k?'selected':''}>${v}</option>`).join('')}</select><select class="control" onchange="setFilter('logs','action',this.value)"><option value="all">全部动作</option>${[...new Set(db.logs.map(x=>x.action))].map(x=>`<option value="${attr(x)}" ${filters.logs.action===x?'selected':''}>${h(x)}</option>`).join('')}</select></div><span class="muted" style="font-size:11px">日志只读，不可修改或删除</span></div>`}<div id="table-results"></div></section>`}
function setFilter(kind,key,value){filters[kind][key]=value;pageNos[kind]=1;renderTable(currentPage)}
function setPage(kind,n){pageNos[kind]=n;renderTable(currentPage)}
function paginate(kind,rows,cols){const n=8,total=rows.length,pg=Math.min(pageNos[kind]||1,Math.max(1,Math.ceil(total/n)));pageNos[kind]=pg;const shown=rows.slice((pg-1)*n,pg*n);return `<div class="tbl-scroll"><table class="table"><thead><tr>${cols.headers.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${shown.map(cols.row).join('')}</tbody></table></div>${!total?ehtml():''}<div class="pagination"><span>共 <strong>${total}</strong> 条 · 当前第 ${pg} / ${Math.max(1,Math.ceil(total/n))} 页</span><div class="pages"><button class="page-button" ${pg===1?'disabled':''} onclick="setPage('${kind}',${pg-1})">上一页</button>${Array.from({length:Math.min(5,Math.ceil(total/n))},(_,i)=>{let t=Math.max(1,Math.min(Math.ceil(total/n)-4,pg-2))+i;return t<=Math.ceil(total/n)?`<button class="page-button ${pg===t?'current':''}" onclick="setPage('${kind}',${t})">${t}</button>`:''}).join('')}<button class="page-button" ${pg>=Math.ceil(total/n)?'disabled':''} onclick="setPage('${kind}',${pg+1})">下一页</button></div></div>`}
function renderTable(page){if(page==='overview'||!can(page,'view'))return;let root=document.getElementById('table-results');if(!root)return;let kind=page==='settings'?settingsTab:page,html='';if(kind==='users'){
 let f=filters.users,rows=db.users.filter(u=>!u.deleted&&(!f.q||[u.studentNo,u.nickname].some(x=>String(x).toLowerCase().includes(f.q.toLowerCase())))&&(f.status==='all'||u.status===f.status)).sort((a,b)=>a.studentNo.localeCompare(b.studentNo));
 html=paginate(kind,rows,{headers:['学号','昵称','年级','专业','账号状态','注册时间','操作'],row:u=>`<tr><td class="mono">${h(u.studentNo)}</td><td><div class="cell-main">${h(u.nickname)}</div></td><td>${h(u.grade)}</td><td>${h(u.major)}</td><td>${dotLabel(u.status==='active'?'正常':'已停用',u.status==='active'?'good':'bad')}</td><td class="mono">${h(u.registeredAt)}</td><td><div class="action-flex"><button class="btn tiny indigo" onclick="openUserDetails('${u.id}')">${I('eye',12)}查看详情</button>${can('users','edit')?`<button class="btn tiny" onclick="toggleUser('${u.id}')">${u.status==='active'?'停用':'恢复'}</button>`:''}</div></td></tr>`})
 }else if(kind==='competitions'){

 html=paginate(kind,rows,{headers:['竞赛 ID / 名称','类别','上架状态','报名开始','报名截止','比赛日期','更新时间','操作'],row:c=>`<tr><td><div class="cell-main">${h(c.name)}</div><div class="cell-sub mono">${c.id}</div></td><td>${h(c.category)}</td><td>${dotLabel(c.listed?'上架':'已下架',c.listed?'good':'neutral')}</td><td class="mono">${fmt(c.regStart)}</td><td class="mono">${fmt(c.regEnd)}</td><td class="mono">${fmt(c.eventDate)}</td><td class="mono">${h(c.updatedAt)}</td><td><div class="action-flex"><button class="btn tiny indigo" onclick="openCompetitionForm('${c.id}')">${can('competitions','edit')?'编辑':'查看'}</button>${can('competitions','edit')?`<button class="btn tiny" onclick="toggleCompetition('${c.id}')">${c.listed?'下架':'上架'}</button>`:''}${can('competitions','delete')?`<button class="btn tiny danger" onclick="deleteCompetition('${c.id}')">删除</button>`:''}</div></td></tr>`})
 }else if(kind==='recruitments'){
 let f=filters.recruitments,rows=db.recruitments.filter(r=>!r.deleted&&(!f.q||[r.id,r.teamName,r.position,cname(r.compId),ulabel(r.publisherId)].some(x=>String(x).toLowerCase().includes(f.q.toLowerCase())))&&(f.comp==='all'||r.compId===f.comp)&&(f.business==='all'||bizStatus(r)===f.business)&&(f.listed==='all'||(f.listed==='listed')===areListed(r))).sort((a,b)=>b.publishedAt.localeCompare(a.publishedAt));
 html=paginate(kind,rows,{headers:['招募帖 ID / 队伍','所属竞赛','岗位','发布者','发布时间','业务状态','展示状态','操作'],row:r=>`<tr><td><div class="cell-main">${h(r.teamName)}</div><div class="cell-sub mono">${h(r.id)} · ${h(r.teamId)}</div></td><td><div class="cell-main" style="max-width:190px" title="${attr(cname(r.compId))}">${h(cname(r.compId))}</div></td><td>${h(r.position)}</td><td>${h(ulabel(r.publisherId))}</td><td class="mono">${h(r.publishedAt)}</td><td>${dotLabel(bizStatus(r),styleFor(bizStatus(r)))}</td><td>${dotLabel(areListed(r)?'上架':'已下架',areListed(r)?'good':'neutral')}</td><td><div class="action-flex"><button class="btn tiny indigo" onclick="openRecruitment('${r.id}')">详情</button>${can('recruitments','edit')?`<button class="btn tiny" onclick="${areListed(r)?'unlistRecruitment':'restoreRecruitment'}('${r.id}')">${areListed(r)?'下架':'恢复'}</button>`:''}${can('recruitments','delete')?`<button class="btn tiny danger" onclick="deleteRecruitment('${r.id}')">删除</button>`:''}</div></td></tr>`})
 }else if(kind==='feedback'){
 let f=filters.feedback,rows=[...db.feedback].filter(x=>!f.q||[x.id,x.summary,x.content,ulabel(x.userId)].some(a=>String(a).toLowerCase().includes(f.q.toLowerCase()))).sort((a,b)=>b.submittedAt.localeCompare(a.submittedAt));

 let f=filters.admins,rows=db.admins.filter(x=>!f.q||[x.id,x.account,x.displayName,x.role].some(a=>String(a).toLowerCase().includes(f.q.toLowerCase())));

 let f=filters.logs,rows=db.logs.filter(x=>(!f.q||[x.actorAccount,x.objectId,x.action,x.id].some(a=>String(a).toLowerCase().includes(f.q.toLowerCase())))&&(f.module==='all'||x.module===f.module)&&(f.action==='all'||x.action===f.action)).sort((a,b)=>b.at.localeCompare(a.at));
 html=paginate(kind,rows,{headers:['操作时间','操作者','模块','动作','业务对象 ID','结果','详情'],row:x=>`<tr><td class="mono">${h(x.at)}</td><td class="mono">${h(x.actorAccount)}</td><td>${h(MOD_NAME[x.module])}</td><td>${h(x.action)}</td><td class="mono">${h(x.objectId)}</td><td>${dotLabel(x.result,'good')}</td><td><button class="btn tiny indigo" onclick="openLog('${x.id}')">查看变更</button></td></tr>`})
 }

}
function openLogs(){if(can('settings','view')){settingsTab='logs';routeTo('settings')}else toast('当前账号无操作日志查看权限','error')}
function showOverlay(title,content,footer='',width='',drawer=false){const host=document.getElementById('overlayHost');host.innerHTML=`<div class="overlay ${drawer?'drawer-overlay':''}" id="overlay" onclick="if(event.target===this)closeOverlay()"><div class="${drawer?'drawer':'modal '+width}" role="dialog" aria-modal="true" aria-label="${attr(title)}"><div class="modal-head"><h2>${title}</h2><button class="close" type="button" aria-label="关闭" onclick="closeOverlay()">${I('x',18)}</button></div><div class="modal-body">${content}</div>${footer?`<div class="modal-foot">${footer}</div>`:''}</div></div>`}
function closeOverlay(){document.getElementById('overlayHost').innerHTML='';confirmCallback=null;batchCredentials=[]}
function dialogConfirm(title,message,callback,opts={}){confirmCallback=callback;showOverlay(title,`<div class="callout ${opts.danger?'danger-note':''}">${I(opts.danger?'alert-circle':'info',16)} <span>${message}</span></div>`,`<button class="btn" onclick="closeOverlay()">取消</button><button class="btn ${opts.danger?'danger':'primary'}" onclick="fireConfirm()">${h(opts.confirmText||'确认')}</button>`,'narrow')}
function fireConfirm(){let fn=confirmCallback;closeOverlay();if(fn)fn()}
function requirePermission(mod,action){if(!can(mod,action)){toast('权限不足，无法执行此操作','error');return false}return true}
function field(name,label,value='',required=false,type='text',extra=''){return `<div class="form-field"><label for="${name}">${label}${required?' <em>*</em>':''}</label><input class="form-control" id="${name}" name="${name}" value="${attr(value||'')}" type="${type}" ${required?'required':''} ${extra}></div>`}
function selector(name,label,options,value='',required=true,disabled=false){return `<div class="form-field"><label for="${name}">${label}${required?' <em>*</em>':''}</label><select class="form-control" id="${name}" name="${name}" ${required?'required':''} ${disabled?'disabled':''}>${options.map(o=>`<option value="${attr(o)}" ${String(o)===String(value)?'selected':''}>${h(o)}</option>`).join('')}</select></div>`}
function getForm(id){let form=document.getElementById(id);if(!form.reportValidity())return null;return Object.fromEntries(new FormData(form).entries())}
function randPassword(){const set='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789!@#';let b=new Uint8Array(14);if(globalThis.crypto?.getRandomValues)globalThis.crypto.getRandomValues(b);else for(let i=0;i<b.length;i++)b[i]=Math.floor(Math.random()*256);return Array.from(b,v=>set[v%set.length]).join('')}
function newSalt(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function openUserDetails(id){const u=person(id);if(!u)return;const rows=[...db.recruitments.filter(x=>x.publisherId===id),...(db.deletedRecruitmentRefs||[]).filter(x=>x.publisherId===id).map(x=>({...x,deleted:true}))];showOverlay('用户详情',`<div class="drawer-hero"><div><strong>${h(u.nickname)}</strong><span>${h(u.studentNo)} · ${h(u.realName)}</span></div>${dotLabel(u.status==='active'?'正常':'已停用',u.status==='active'?'good':'bad')}</div><h3 class="subhead">账号基础信息</h3><div class="kv-grid">${[['学号',u.studentNo],['姓名',u.realName],['昵称',u.nickname],['年级',u.grade],['专业',u.major],['技能标签',u.skills.join(' / ')],['联系方式',u.contact||'未填写'],['账号状态',u.status==='active'?'正常':'已停用'],['注册时间',u.registeredAt]].map(x=>`<div class="kv-item"><label>${x[0]}</label><strong>${h(x[1])}</strong></div>`).join('')}</div><hr class="modal-divider"><h3 class="subhead">历史发布的招募记录 · ${rows.length} 条</h3>${rows.length?`<div class="tbl-scroll"><table class="table" style="min-width:490px"><thead><tr><th>队伍名称</th><th>所属竞赛</th><th>招募状态</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${h(r.deleted?'该内容已删除':r.teamName)}</td><td>${h(cname(r.compId))}</td><td>${dotLabel(r.deleted?'已删除':bizStatus(r),r.deleted?'bad':styleFor(bizStatus(r)))}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">暂无招募记录</p>'}<p class="box-note">停用账号不会清除历史招募和组队记录；删除账号会从正常用户列表移除，但保留关联业务记录。</p>`,`${can('users','delete')?`<button class="btn danger" onclick="deleteUser('${u.id}')">${I('trash',14)}删除账号</button>`:''}${can('users','edit')?`<button class="btn" onclick="resetUserPassword('${u.id}')">${I('key-round',14)}重置密码</button><button class="btn primary" onclick="openUserForm('${u.id}')">${I('edit',14)}编辑资料</button>`:''}`, '',true)}
function openUserForm(id=''){if(!requirePermission('users',id?'edit':'create'))return;let u=id?person(id):{};if(id&&!u)return;showOverlay(id?'编辑用户资料':'单个录入用户',`<form id="userForm" onsubmit="event.preventDefault();submitUserForm('${id}')"><div class="form-grid">${field('studentNo','学号',u.studentNo,true,'text',id?'disabled':'pattern="[0-9]{8,15}" title="8～15 位数字学号"')}${field('realName','姓名',u.realName,true)}${field('nickname','昵称',u.nickname,true)}${selector('grade','年级',['2023级','2024级','2025级','2026级','2027级'],u.grade||'2026级')}${field('major','专业',u.major,true)}${field('skills','技能标签（逗号分隔）',u.skills?.join('，'),false)}${field('contact','联系方式',u.contact)}</div><p class="box-note">新增学生账号不会使用公开的统一初始密码；实际系统应通过独立临时凭据或安全激活流程发放访问权。</p></form>`,`<button class="btn" onclick="closeOverlay()">取消</button><button class="btn primary" onclick="document.getElementById('userForm').requestSubmit()">${id?'保存修改':'创建账号'}</button>`)}
async function submitUserForm(id){let v=getForm('userForm');if(!v)return;let no=id?person(id).studentNo:String(v.studentNo).trim();if(!/^\d{8,15}$/.test(no)){toast('学号须为 8～15 位数字','error');return}if(!id&&db.users.some(x=>x.studentNo===no)){toast('该学号已存在，禁止重复导入','error');return}let payload={realName:v.realName.trim(),nickname:v.nickname.trim(),grade:v.grade,major:v.major.trim(),skills:(v.skills||'').split(/[,，、]/).map(s=>s.trim()).filter(Boolean),contact:v.contact.trim()};if(!payload.nickname||!payload.realName||!payload.major){toast('请填写姓名、昵称和专业','error');return}if(id){let u=person(id),before=JSON.stringify({realName:u.realName,nickname:u.nickname,grade:u.grade,major:u.major,skills:u.skills,contact:u.contact});Object.assign(u,payload);recordLog('users','编辑用户',id,'编辑用户基础资料',before,JSON.stringify(payload));closeOverlay();render();toast('用户资料已保存')}else{let pass=randPassword(),salt=newSalt(),hash=await pwdDigest(pass,salt);let u={...payload,id:uid('U'),studentNo:no,status:'active',registeredAt:timestamp(),deleted:false,tempPasswordHash:hash,tempPasswordSalt:salt};db.users.push(u);recordLog('users','新增用户',u.id,'单条录入学号 '+no+'；生成独立临时凭据（不记录明文）','无','账号已创建');closeOverlay();render();showOverlay('学生账号已创建',`<div class="callout">已为该账号生成独立临时凭据，仅展示一次。请通过安全渠道交付；正式学生端需接入服务端登录与首次改密流程。</div><div class="info-card" style="margin-top:14px"><span>学号</span><strong class="mono">${h(no)}</strong></div><div class="info-card" style="margin-top:8px"><span>临时密码（仅演示）</span><strong id="tempPwdText" style="font-size:20px;letter-spacing:1px">${h(pass)}</strong></div>`,`<button class="btn" onclick="copyTemp()">${I('file-text',14)}复制凭据</button><button class="btn primary" onclick="closeOverlay()">完成</button>`,'narrow');toast('学生账号已创建')}}
function toggleUser(id){if(!requirePermission('users','edit'))return;let u=person(id);if(!u||u.deleted)return;let next=u.status==='active'?'disabled':'active';dialogConfirm(next==='disabled'?'停用用户账号':'恢复用户账号',`确认${next==='disabled'?'停用':'恢复'} <strong>${h(u.nickname)}（${h(u.studentNo)}）</strong> 吗？${next==='disabled'?'停用后该账号不能登录及进行写操作，历史记录仍保留。':''}`,()=>{let old=u.status;u.status=next;recordLog('users',next==='disabled'?'停用账号':'恢复账号',id,'账号状态变更',old,next);render();toast('账号状态已更新')},{confirmText:'确认'+(next==='disabled'?'停用':'恢复')})}
function deleteUser(id){if(!requirePermission('users','delete'))return;let u=person(id);if(!u)return;dialogConfirm('删除用户账号',`确定删除账号 <strong>${h(u.studentNo)} · ${h(u.nickname)}</strong>？账号将从用户列表移除，历史招募及组队记录保留；此操作在演示中不可恢复。`,()=>{u.deleted=true;u.status='disabled';recordLog('users','删除用户',id,'删除账号并保留业务历史','账号可见','账号已删除');render();toast('账号已删除')},{danger:true,confirmText:'确认删除'})}
async function resetUserPassword(id){if(!requirePermission('users','edit'))return;let u=person(id);if(!u)return;dialogConfirm('重置学生账号密码',`将为 <strong>${h(u.studentNo)}</strong> 生成<strong>仅展示一次</strong>的独立临时密码，不会读取或显示原密码。`,async()=>{let pass=randPassword(),salt=newSalt();u.tempPasswordHash=await pwdDigest(pass,salt);u.tempPasswordSalt=salt;recordLog('users','重置密码',id,'生成独立临时凭据（日志不包含密码）','旧密码不可见','重置已发起');render();showOverlay('临时密码已生成',`<div class="callout">这是演示凭据，仅在本窗口显示一次。请通过安全渠道交付给用户；实际学生端需要实现服务端一次性重置与首次登录改密。</div><div class="info-card" style="margin-top:15px"><span>账号</span><strong class="mono">${h(u.studentNo)}</strong></div><div class="info-card" style="margin-top:8px"><span>一次性临时凭据（仅演示）</span><strong style="font-size:21px;letter-spacing:1px" id="tempPwdText">${h(pass)}</strong></div>`,`<button class="btn" onclick="copyTemp()">${I('file-text',14)}复制凭据</button><button class="btn primary" onclick="closeOverlay()">已知悉</button>`,'narrow');toast('密码重置操作已记录')},{confirmText:'生成临时凭据'})}
function openCompetitionForm(id=''){if(!can('competitions',id?'view':'create'))return;const editable=can('competitions',id?'edit':'create');let c=id?comp(id):{};if(id&&!c)return;showOverlay(id?(editable?'编辑竞赛':'查看竞赛'):'新增竞赛',`<form id="compForm" onsubmit="event.preventDefault();submitCompetition('${id}')"><div class="form-grid">${id?`<div class="form-field"><label>竞赛 ID</label><input class="form-control" value="${attr(c.id)}" disabled></div>`:''}${field('name','竞赛名称',c.name,true,'text',editable?'':'disabled')}${selector('category','竞赛类别',db.categories,c.category||db.categories[0],true,!editable)}${field('regStart','报名开始日期',c.regStart,false,'date',editable?'':'disabled')}${field('regEnd','报名截止日期',c.regEnd,false,'date',editable?'':'disabled')}${field('eventDate','比赛日期（可待公布）',c.eventDate,false,'date',editable?'':'disabled')}</div><div class="box-note">报名开始日是比赛日历的报名周期起点。未公布日期留空，客户端显示“待公布”，不自动推测赛事时间。</div></form>`,`${editable?`<button class="btn" onclick="closeOverlay()">取消</button><button class="btn primary" onclick="document.getElementById('compForm').requestSubmit()">${id?'保存竞赛':'创建竞赛'}</button>`:`<button class="btn" onclick="closeOverlay()">关闭</button>`}`)}
function submitCompetition(id){if(!requirePermission('competitions',id?'edit':'create'))return;let v=getForm('compForm');if(!v)return;if(!v.name.trim()){toast('请输入竞赛名称','error');return}if(v.regStart&&v.regEnd&&v.regEnd<v.regStart){toast('报名截止不得早于报名开始','error');return}const payload={name:v.name.trim(),category:v.category,regStart:v.regStart,regEnd:v.regEnd,eventDate:v.eventDate,updatedAt:timestamp()};if(id){let c=comp(id),before=JSON.stringify({name:c.name,category:c.category,regStart:c.regStart,regEnd:c.regEnd,eventDate:c.eventDate});Object.assign(c,payload);recordLog('competitions','编辑竞赛',id,'竞赛基础信息或日程更新',before,JSON.stringify(payload))}else{let c={id:'C'+String(Math.max(...db.competitions.map(x=>parseInt(x.id.slice(1))||0))+1).padStart(3,'0'),...payload,listed:true,deleted:false};db.competitions.push(c);recordLog('competitions','新增竞赛',c.id,'新增竞赛 '+c.name,'无','已上架')}closeOverlay();render();toast(id?'竞赛资料已更新':'竞赛已创建')}
function cascadeDown(id){let count=0;for(let r of db.recruitments){if(r.compId===id&&!r.deleted&&r.listed){r.listed=false;r.hiddenReason='competition';count++}}return count}
function toggleCompetition(id){if(!requirePermission('competitions','edit'))return;let c=comp(id);if(!c||c.deleted)return;let next=!c.listed;dialogConfirm(next?'上架竞赛':'下架竞赛',next?`确认上架 <strong>${h(c.name)}</strong>？原先被下架的关联招募帖<strong>不会自动恢复</strong>，需逐条满足恢复条件。`:`确认下架 <strong>${h(c.name)}</strong>？所有关联上架招募帖将同步下架，客户端不再展示；历史组队记录保留。`,()=>{let count=next?0:cascadeDown(id);c.listed=next;c.updatedAt=timestamp();recordLog('competitions',next?'上架竞赛':'下架竞赛',id,next?'竞赛上架；关联招募帖不自动恢复':`竞赛下架，连带下架 ${count} 条招募帖`,next?'下架':'上架',next?'上架':'下架');render();toast(next?'竞赛已上架':`竞赛已下架，同步隐藏 ${count} 条招募帖`)},{danger:!next,confirmText:next?'确认上架':'确认下架'})}
function deleteCompetition(id){if(!requirePermission('competitions','delete'))return;let c=comp(id);if(!c||c.deleted)return;dialogConfirm('删除竞赛',`确认删除 <strong>${h(c.name)}（${h(c.id)}）</strong>？关联招募帖同步下架，历史组队记录保留。竞赛 ID 将保留在历史数据中以防关联丢失。`,()=>{let count=cascadeDown(id);c.deleted=true;c.listed=false;c.updatedAt=timestamp();recordLog('competitions','删除竞赛',id,`删除竞赛，关联 ${count} 条招募帖同步下架`,'竞赛存在','竞赛已删除（历史 ID 保留）');render();toast(`竞赛已删除，关联 ${count} 条招募帖下架`)},{danger:true,confirmText:'确认删除'})}
function openCategories(){if(!requirePermission('competitions','edit'))return;showOverlay('竞赛类别管理',`<p class="muted" style="margin-bottom:15px">维护客户端发布招募与找队伍筛选共同使用的竞赛类别。</p><div id="categoryList">${categoryRows()}</div><div class="form-grid" style="margin-top:17px;grid-template-columns:1fr auto;align-items:end"><div class="form-field"><label>新增类别</label><input class="form-control" id="categoryName" placeholder="例如：数学建模类"></div><button class="btn primary" onclick="addCategory()">${I('plus',14)}新增</button></div>`,`<button class="btn" onclick="closeOverlay();render()">完成</button>`)}
function categoryRows(){return db.categories.map((c,i)=>`<div style="display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eef1f5;padding:12px 2px;gap:12px"><div><strong style="font-size:12px">${h(c)}</strong><span class="muted" style="margin-left:10px;font-size:11px">${db.competitions.filter(x=>!x.deleted&&x.category===c).length} 项竞赛</span></div><div class="action-flex"><button class="btn tiny" onclick="renameCategory(${i})">重命名</button><button class="btn tiny danger" onclick="removeCategory(${i})">删除</button></div></div>`).join('')}
function addCategory(){let inp=document.getElementById('categoryName'),v=inp.value.trim();if(!v){toast('请输入类别名称','error');return}if(db.categories.includes(v)){toast('该类别已存在','error');return}db.categories.push(v);recordLog('competitions','新增类别',v,'新增竞赛分类','','已新增');document.getElementById('categoryList').innerHTML=categoryRows();inp.value='';render();toast('类别已添加')}
function renameCategory(i){let old=db.categories[i];let v=prompt('请输入新的竞赛类别名称',old)?.trim();if(v===undefined||v===old)return;if(!v||db.categories.includes(v)){toast('类别名称无效或已存在','error');return}db.categories[i]=v;db.competitions.filter(x=>x.category===old).forEach(x=>x.category=v);if(filters.competitions.category===old)filters.competitions.category=v;recordLog('competitions','重命名类别',old,'同步更新关联竞赛分类',old,v);document.getElementById('categoryList').innerHTML=categoryRows();render();toast('类别已更新')}
function removeCategory(i){let c=db.categories[i],num=db.competitions.filter(x=>!x.deleted&&x.category===c).length;if(num){toast(`类别下仍有 ${num} 项竞赛，请先调整其类别`,'error');return}if(db.categories.length===1){toast('必须保留至少一个竞赛类别','error');return}dialogConfirm('删除竞赛类别',`确定删除 <strong>${h(c)}</strong>？`,()=>{db.categories.splice(i,1);recordLog('competitions','删除类别',c,'删除未被引用的竞赛类别','存在','已删除');render();toast('类别已删除')},{danger:true,confirmText:'删除类别'})}
function openRecruitment(id){let r=db.recruitments.find(x=>x.id===id);if(!r){if((db.deletedRecruitmentRefs||[]).some(x=>x.id===id))showOverlay('招募帖',`<div class="callout danger-note">${I('info',16)} 该内容已删除</div>`,`<button class="btn primary" onclick="closeOverlay()">关闭</button>`,'narrow');return}showOverlay('招募帖详情',`<div class="drawer-hero"><div><strong>${h(r.teamName)}</strong><span>${h(r.id)} · ${h(r.teamId)}</span></div>${dotLabel(bizStatus(r),styleFor(bizStatus(r)))}</div><div class="info-grid"><div class="info-card"><span>展示状态</span><strong>${areListed(r)?'上架':'已下架'}</strong></div><div class="info-card"><span>岗位 / 人数</span><strong>${h(r.position)} · ${r.joined}/${r.quota} 人（已加入/名额）</strong></div></div><hr class="modal-divider"><h3 class="subhead">招募信息</h3><div class="kv-grid">${[['竞赛名称',cname(r.compId)],['竞赛 ID',r.compId],['发布者',ulabel(r.publisherId)],['发布者账号',(person(r.publisherId)&&!person(r.publisherId).deleted?person(r.publisherId).studentNo:'账号已删除')],['岗位名称',r.position],['能力要求',r.requirements],['招募起始日期',r.startsAt],['招募截止日期',r.endsAt],['发布时间',r.publishedAt],['队伍 ID',r.teamId]].map(x=>`<div class="kv-item"><label>${x[0]}</label><strong>${h(x[1])}</strong></div>`).join('')}</div><div class="box-note">名额已满、关闭、时间截止及未开始均由原业务字段决定。管理端不代替队长处理组队申请。</div>`,`${can('recruitments','delete')?`<button class="btn danger" onclick="deleteRecruitment('${r.id}')">删除招募帖</button>`:''}${can('recruitments','edit')?`<button class="btn primary" onclick="${areListed(r)?'unlistRecruitment':'restoreRecruitment'}('${r.id}')">${areListed(r)?'下架':'恢复展示'}</button>`:''}`,'',true)}

function resetDemo(){dialogConfirm('重置所有演示数据',`此操作将<strong>清除当前浏览器本地的全部模拟修改</strong>，恢复原始示例账号、竞赛、招募帖、反馈和日志。`,async()=>{db=seedData();await ensureSeedHashes();save();filters.users={q:'',status:'all'};filters.recruitments={q:'',comp:'all',business:'all',listed:'all'};currentPage='overview';render();toast('演示数据已重置')},{danger:true,confirmText:'重置演示数据'})}

function renderLogin(){document.getElementById('app').innerHTML=`<div class="login-screen"><section class="login-art"><div class="login-brand"><span class="brand-mark">G</span><strong>GDUTmate</strong></div><div class="login-copy"><div class="login-tag">ADMIN MANAGEMENT PLATFORM</div><h1>让竞赛组队管理<br><span>更清晰、更高效。</span></h1><p>统一维护用户、竞赛与招募内容，用准确的业务状态和完整的操作留痕支撑平台日常运营。</p><div class="login-pills"><span>六大管理模块</span><span>模块级权限管理</span><span>关键操作留痕</span></div></div><div class="login-footer">GDUTmate · 管理端 V1 交互原型 · 仅供演示</div></section><section class="login-right"><div class="login-card"><div class="welcome">WELCOME BACK</div><h2>管理员登录</h2><p>使用独立管理端账号与密码登录后台。</p><form class="login-form" id="loginForm" onsubmit="event.preventDefault();login()"><div class="form-field"><label>学号 / 管理员账号</label><input class="form-control" id="loginAccount" autocomplete="username" placeholder="请输入管理员学号" required></div><div class="form-field"><label>密码</label><input class="form-control" id="loginPassword" type="password" autocomplete="current-password" placeholder="请输入管理端密码" required></div><div class="help-row"><span>仅授权管理员可登录</span><span>与学生端凭据相互独立</span></div><div class="login-error" id="loginError"></div><button class="btn primary" type="submit">登录管理后台 ${I('arrow-right',16)}</button></form><div class="demo-accounts"><h3>演示账号（点击填入）</h3>${DEMO_LOGINS.map(([a,p,r])=>`<div class="demo-account"><span>${h(r)} · ${h(a)}</span><button type="button" onclick="fillLogin('${a}','${p}')">使用此账号</button></div>`).join('')}</div><p style="line-height:1.8;font-size:10px">这是离线浏览器原型，不连接真实数据库，登录与权限校验仅供交互演示，不能作为生产认证方案。</p></div></section></div>`}
function fillLogin(a,p){document.getElementById('loginAccount').value=a;document.getElementById('loginPassword').value=p;document.getElementById('loginError').textContent=''}
async function login(){let acc=document.getElementById('loginAccount').value.trim(),pwd=document.getElementById('loginPassword').value,a=db.admins.find(x=>x.account===acc);const err=document.getElementById('loginError');if(!a||a.status!=='active'){err.textContent='账号不存在或已停用';return}let dig=await pwdDigest(pwd,a.salt);if(dig!==a.passwordHash){err.textContent='管理员账号或密码错误';return}sessionAdminId=a.id;demoSessionStorage.setItem(SESSION,a.id);currentPage='overview';render();toast('已进入 GDUTmate 管理端')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('overlay'))closeOverlay()});
(async()=>{await ensureSeedHashes();if(sessionAdminId&&!admin())sessionAdminId='';render()})();
</script>
</body>
</html>
